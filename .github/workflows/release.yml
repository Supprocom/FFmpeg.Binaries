name: FFmpeg release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: Package family to stage
        required: true
        default: 9.0.2.1
        type: choice
        options:
          - 9.0.2.1
          - 9.0.2-lgpl.1

permissions:
  contents: read

concurrency:
  group: ffmpeg-release-${{ github.ref }}-${{ inputs.version || 'both' }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  validate:
    name: Validate release engine
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Build and self-test the release engine
        run: |
          dotnet build FFmpeg.Release.csproj --configuration Release --nologo
          dotnet run --project FFmpeg.Release.csproj --configuration Release --no-build -- --self-test
          dotnet run --project FFmpeg.Release.csproj --configuration Release --no-build -- --emit-worker-matrix

  worker-linux:
    name: Build ${{ matrix.version }} / ${{ matrix.rid }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(github.event_name == 'push' && '["9.0.2.1","9.0.2-lgpl.1"]' || format('["{0}"]', inputs.version)) }}
        rid:
          - linux-x64
          - linux-arm64
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm"}')[matrix.rid] }}
    timeout-minutes: 240
    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Install exact native and media build prerequisites
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            build-essential=12.10ubuntu1 \
            file=1:5.45-3build1 \
            gnupg=2.4.4-2ubuntu17.6 \
            nasm=2.16.01-1build1 \
            patchelf=0.18.0-1.1build1 \
            xz-utils=5.6.1+really5.4.5-1ubuntu0.3 \
            libaom-dev=3.8.2-2ubuntu0.2 \
            libass-dev=1:0.17.1-2build1 \
            libbluray-dev=1:1.3.4-1build1 \
            libbz2-dev=1.0.8-5.1ubuntu0.1 \
            libdav1d-dev=1.4.1-1build1 \
            libfontconfig-dev=2.15.0-1.1ubuntu2 \
            libfreetype-dev=2.13.2+dfsg-1ubuntu0.1 \
            libfribidi-dev=1.0.13-3build1 \
            libgnutls28-dev=3.8.3-1.1ubuntu3.6 \
            libharfbuzz-dev=8.3.0-2build2 \
            libjxl-dev=0.7.0-10.2ubuntu6.1 \
            liblzma-dev=5.6.1+really5.4.5-1ubuntu0.3 \
            libmp3lame-dev=3.100-6build1 \
            libopenh264-dev=2.4.1+dfsg-1 \
            libopenjp2-7-dev=2.5.0-2ubuntu0.5 \
            libopus-dev=1.4-1build1 \
            libsdl2-dev=2.30.0+dfsg-1ubuntu3.1 \
            libsnappy-dev=1.1.10-1build1 \
            libsoxr-dev=0.1.3-4build3 \
            libspeex-dev=1.2.1-2ubuntu2.24.04.1 \
            libsrt-gnutls-dev=1.5.3-1build2 \
            libssh-gcrypt-dev=0.10.6-2ubuntu0.5 \
            libtheora-dev=1.1.1+dfsg.1-16.1build3 \
            libvorbis-dev=1.3.7-1build3 \
            libvpx-dev=1.14.0-1ubuntu2.3 \
            libwebp-dev=1.3.2-0.4build3 \
            libxml2-dev=2.9.14+dfsg-1.3ubuntu3.9 \
            libzimg-dev=3.0.5+ds1-1build1 \
            libzmq3-dev=4.3.5-1build2 \
            pkgconf=1.8.1-2build1 \
            zlib1g-dev=1:1.3.dfsg-3.1ubuntu2.2 \
            librubberband-dev=3.3.0+dfsg-2build1 \
            libvidstab-dev=1.1.0-2build1 \
            libx264-dev=2:0.164.3108+git31e19f9-1 \
            libx265-dev=3.5-2build1 \
            libxvidcore-dev=2:1.3.7-1build1

      - name: Produce independently reproduced native payload
        run: >-
          dotnet run --project FFmpeg.Release.csproj --configuration Release --
          --worker --version "${{ matrix.version }}" --rid "${{ matrix.rid }}"
          --release-root "${RUNNER_TEMP}/release"
          --worker-output-root "${RUNNER_TEMP}/worker-artifacts"

      - name: Upload accepted worker evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-${{ matrix.version }}-${{ matrix.rid }}
          path: ${{ runner.temp }}/worker-artifacts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  worker-musl:
    name: Build ${{ matrix.version }} / ${{ matrix.rid }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(github.event_name == 'push' && '["9.0.2.1","9.0.2-lgpl.1"]' || format('["{0}"]', inputs.version)) }}
        rid:
          - linux-musl-x64
          - linux-musl-arm64
    runs-on: ${{ fromJSON('{"linux-musl-x64":"ubuntu-24.04","linux-musl-arm64":"ubuntu-24.04-arm"}')[matrix.rid] }}
    timeout-minutes: 240
    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Produce independently reproduced musl payload
        env:
          RELEASE_RID: ${{ matrix.rid }}
          RELEASE_VERSION: ${{ matrix.version }}
          SDK_IMAGE: mcr.microsoft.com/dotnet/sdk@sha256:3f9c03432d664163a90d20e3ed0a3784d0aa82c1b9cbd1a7dd4609fede95669e
        run: |
          docker run --rm \
            --env RELEASE_RID \
            --env RELEASE_VERSION \
            --env SUPPROCOM_WORKER_IMAGE="${SDK_IMAGE}" \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}:/runner-temp" \
            --workdir /workspace \
            "${SDK_IMAGE}" \
            sh -euxc '
              apk add --no-cache \
                bash=5.3.3-r1 \
                build-base=0.5-r3 \
                file=5.46-r2 \
                gnupg=2.4.9-r0 \
                nasm=2.16.03-r0 \
                patchelf=0.18.0-r3 \
                tar=1.35-r4 \
                xz=5.8.4-r0 \
                aom-dev=3.14.1-r0 \
                bzip2-dev=1.0.8-r6 \
                dav1d-dev=1.5.2-r0 \
                fontconfig-dev=2.17.1-r0 \
                freetype-dev=2.14.3-r0 \
                fribidi-dev=1.0.16-r2 \
                gnutls-dev=3.8.13-r0 \
                harfbuzz-dev=12.2.0-r0 \
                lame-dev=3.100-r5 \
                libass-dev=0.17.4-r0 \
                libbluray-dev=1.4.0-r0 \
                libjxl-dev=0.11.2-r0 \
                libsrt-dev=1.5.3-r1 \
                libssh-dev=0.11.4-r0 \
                libtheora-dev=1.2.0-r0 \
                libvorbis-dev=1.3.7-r2 \
                libvpx-dev=1.15.2-r1 \
                libwebp-dev=1.6.0-r0 \
                libxml2-dev=2.13.9-r1 \
                openh264-dev=2.6.0-r0 \
                openjpeg-dev=2.5.4-r1 \
                opus-dev=1.5.2-r1 \
                pkgconf=2.5.1-r0 \
                sdl2-dev=2.32.10-r0 \
                snappy-dev=1.2.2-r0 \
                soxr-dev=0.1.3-r7 \
                speex-dev=1.2.1-r2 \
                xz-dev=5.8.4-r0 \
                zeromq-dev=4.3.5-r2 \
                zimg-dev=3.0.6-r0 \
                zlib-dev=1.3.2-r0 \
                rubberband-dev=4.0.0-r0 \
                vidstab-dev=1.1.1-r0 \
                x264-dev=0.164.3108-r1 \
                x265-dev=4.1-r0 \
                xvidcore-dev=1.3.7-r2
              git config --global --add safe.directory /workspace
              dotnet run --project FFmpeg.Release.csproj --configuration Release -- \
                --worker --version "${RELEASE_VERSION}" --rid "${RELEASE_RID}" \
                --release-root /runner-temp/release \
                --worker-output-root /runner-temp/worker-artifacts
            '

      - name: Upload accepted worker evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-${{ matrix.version }}-${{ matrix.rid }}
          path: ${{ runner.temp }}/worker-artifacts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  worker-macos:
    name: Build ${{ matrix.version }} / ${{ matrix.rid }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(github.event_name == 'push' && '["9.0.2.1","9.0.2-lgpl.1"]' || format('["{0}"]', inputs.version)) }}
        rid:
          - osx-x64
          - osx-arm64
    runs-on: ${{ fromJSON('{"osx-x64":"macos-15-intel","osx-arm64":"macos-15"}')[matrix.rid] }}
    timeout-minutes: 240
    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Install version-gated native and media prerequisites
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install \
            gnupg nasm pkgconf aom bzip2 dav1d fontconfig freetype fribidi gnutls \
            harfbuzz jpeg-xl lame libass libbluray libsoxr libssh theora libvorbis \
            libvpx libxml2 openh264 openjpeg opus sdl2-compat snappy speex srt webp xz \
            zeromq zimg libvidstab rubberband x264 x265 xvid
          {
            echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig"
            echo "CPPFLAGS=-I$(brew --prefix libxml2)/include/libxml2"
            echo "LDFLAGS=-L$(brew --prefix libxml2)/lib"
          } >> "${GITHUB_ENV}"

      - name: Produce independently reproduced native payload
        run: >-
          dotnet run --project FFmpeg.Release.csproj --configuration Release --
          --worker --version "${{ matrix.version }}" --rid "${{ matrix.rid }}"
          --release-root "${RUNNER_TEMP}/release"
          --worker-output-root "${RUNNER_TEMP}/worker-artifacts"

      - name: Upload accepted worker evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-${{ matrix.version }}-${{ matrix.rid }}
          path: ${{ runner.temp }}/worker-artifacts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  worker-windows:
    name: Build ${{ matrix.version }} / ${{ matrix.rid }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(github.event_name == 'push' && '["9.0.2.1","9.0.2-lgpl.1"]' || format('["{0}"]', inputs.version)) }}
        rid:
          - win-x86
          - win-x64
          - win-arm64
    runs-on: ${{ fromJSON('{"win-x86":"windows-2025","win-x64":"windows-2025","win-arm64":"windows-11-arm"}')[matrix.rid] }}
    timeout-minutes: 300
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf input

      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Install MSYS2 toolchain
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ${{ fromJSON('{"win-x86":"MINGW32","win-x64":"UCRT64","win-arm64":"CLANGARM64"}')[matrix.rid] }}
          update: true
          path-type: inherit
          install: >-
            base-devel
            diffutils
            file
            git
            gnupg
            nasm
            tar
            xz
          pacboy: ${{ fromJSON('{"win-x86":"","win-x64":"toolchain:p","win-arm64":"toolchain:p"}')[matrix.rid] }}

      - name: Install current 64-bit media stack
        if: matrix.rid != 'win-x86'
        shell: msys2 {0}
        run: |
          for attempt in 1 2 3 4; do
            if pacboy -S --needed --noconfirm \
              SDL2:p aom:p bzip2:p dav1d:p fontconfig:p freetype:p fribidi:p gnutls:p \
              harfbuzz:p lame:p libass:p libbluray:p libiconv:p libjxl:p libsoxr:p libssh:p \
              libtheora:p libvorbis:p libvpx:p libwebp:p libxml2:p openh264:p \
              openjpeg2:p opus:p pkgconf:p snappy:p speex:p srt:p xz:p zeromq:p \
              zimg:p zlib:p libx264:p rubberband:p vid.stab:p x265:p xvidcore:p; then
              break
            fi
            if [[ "${attempt}" == 4 ]]; then
              exit 1
            fi
            sleep 5
          done

      - name: Install SHA-locked archived win-x86 media stack
        if: matrix.rid == 'win-x86'
        shell: msys2 {0}
        env:
          ARCHIVE_ROOT: ${{ runner.temp }}/msys2-i686-packages
        run: |
          mkdir -p "${ARCHIVE_ROOT}"
          packages=()
          while IFS=$'\t' read -r package version archive sha256; do
            if [[ "${package}" == \#* || -z "${package}" ]]; then
              continue
            fi
            path="${ARCHIVE_ROOT}/${archive}"
            curl --fail --location --retry 4 --output "${path}" \
              "https://mirror.msys2.org/mingw/mingw32/${archive}"
            printf '%s  %s\n' "${sha256}" "${path}" | sha256sum --check --strict
            packages+=("${path}")
          done < eng/msys2-i686-packages.lock
          pacman -U --noconfirm "${packages[@]}"

      - name: Produce independently reproduced native payload
        shell: msys2 {0}
        run: |
          dotnet run --project FFmpeg.Release.csproj --configuration Release -- \
            --worker --version "${{ matrix.version }}" --rid "${{ matrix.rid }}" \
            --release-root "${RUNNER_TEMP}/release" \
            --worker-output-root "${RUNNER_TEMP}/worker-artifacts"

      - name: Upload accepted worker evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-${{ matrix.version }}-${{ matrix.rid }}
          path: ${{ runner.temp }}/worker-artifacts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble and freeze ${{ matrix.version }}
    needs:
      - worker-linux
      - worker-musl
      - worker-macos
      - worker-windows
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(github.event_name == 'push' && '["9.0.2.1","9.0.2-lgpl.1"]' || format('["{0}"]', inputs.version)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Download accepted worker evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: worker-${{ matrix.version }}-*
          path: ${{ runner.temp }}/worker-artifacts
          merge-multiple: true

      - name: Assemble and freeze exact package bytes
        run: >-
          dotnet run --project FFmpeg.Release.csproj --configuration Release --
          --assemble --version "${{ matrix.version }}"
          --release-root "${RUNNER_TEMP}/release"
          --worker-artifact-root "${RUNNER_TEMP}/worker-artifacts"
          --package-output-root "${RUNNER_TEMP}/package-artifacts"

      - name: Upload frozen package family
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frozen-packages-${{ matrix.version }}
          path: ${{ runner.temp }}/package-artifacts
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  consumer-native:
    name: Consume ${{ matrix.version }} / ${{ matrix.rid }}
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(github.event_name == 'push' && '["9.0.2.1","9.0.2-lgpl.1"]' || format('["{0}"]', inputs.version)) }}
        rid:
          - win-x86
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64
    runs-on: ${{ fromJSON('{"win-x86":"windows-2025","win-x64":"windows-2025","win-arm64":"windows-11-arm","linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","osx-x64":"macos-15-intel","osx-arm64":"macos-15"}')[matrix.rid] }}
    timeout-minutes: 60
    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Download frozen package family
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: frozen-packages-${{ matrix.version }}
          path: ${{ runner.temp }}/packages

      - name: Run Unix consumer gate
        if: runner.os != 'Windows'
        run: >-
          dotnet run --project FFmpeg.Release.csproj --configuration Release --
          --consumer-gate --version "${{ matrix.version }}" --rid "${{ matrix.rid }}"
          --package-root "${RUNNER_TEMP}/packages"
          --test-root "${RUNNER_TEMP}/consumer-gates"
          --consumer-output-root "${RUNNER_TEMP}/consumer-attestations"

      - name: Run Windows consumer gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          dotnet run --project FFmpeg.Release.csproj --configuration Release --
          --consumer-gate --version "${{ matrix.version }}" --rid "${{ matrix.rid }}"
          --package-root "${env:RUNNER_TEMP}/packages"
          --test-root "${env:RUNNER_TEMP}/consumer-gates"
          --consumer-output-root "${env:RUNNER_TEMP}/consumer-attestations"

      - name: Upload consumer attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consumer-${{ matrix.version }}-${{ matrix.rid }}
          path: ${{ runner.temp }}/consumer-attestations
          if-no-files-found: error
          retention-days: 30

  consumer-musl:
    name: Consume ${{ matrix.version }} / ${{ matrix.rid }}
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(github.event_name == 'push' && '["9.0.2.1","9.0.2-lgpl.1"]' || format('["{0}"]', inputs.version)) }}
        rid:
          - linux-musl-x64
          - linux-musl-arm64
    runs-on: ${{ fromJSON('{"linux-musl-x64":"ubuntu-24.04","linux-musl-arm64":"ubuntu-24.04-arm"}')[matrix.rid] }}
    timeout-minutes: 60
    steps:
      - name: Check out the release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download frozen package family
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: frozen-packages-${{ matrix.version }}
          path: ${{ runner.temp }}/packages

      - name: Run musl consumer gate
        env:
          RELEASE_RID: ${{ matrix.rid }}
          RELEASE_VERSION: ${{ matrix.version }}
          SDK_IMAGE: mcr.microsoft.com/dotnet/sdk@sha256:3f9c03432d664163a90d20e3ed0a3784d0aa82c1b9cbd1a7dd4609fede95669e
        run: |
          docker run --rm \
            --env RELEASE_RID \
            --env RELEASE_VERSION \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --volume "${RUNNER_TEMP}:/runner-temp" \
            --workdir /workspace \
            "${SDK_IMAGE}" \
            sh -euxc '
              apk add --no-cache git
              git config --global --add safe.directory /workspace
              dotnet run --project FFmpeg.Release.csproj --configuration Release -- \
                --consumer-gate --version "${RELEASE_VERSION}" --rid "${RELEASE_RID}" \
                --package-root /runner-temp/packages \
                --test-root /runner-temp/consumer-gates \
                --consumer-output-root /runner-temp/consumer-attestations
            '

      - name: Upload consumer attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consumer-${{ matrix.version }}-${{ matrix.rid }}
          path: ${{ runner.temp }}/consumer-attestations
          if-no-files-found: error
          retention-days: 30
